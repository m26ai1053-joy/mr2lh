<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Why discover before rewriting? · Delta MERGE</title>
<style>
:root{--ink:#152e43;--muted:#506679;--bg:#f3f6f4;--line:#cedbd7;--green:#087568;--blue:#255bb2;--orange:#a15313}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:18px/1.45 system-ui,sans-serif}header{padding:16px 3vw;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:14px;letter-spacing:.12em;font-weight:800}button,a.button{font:inherit;font-size:14px;padding:9px 13px;border:1px solid #a9bfba;border-radius:7px;background:white;color:var(--ink);cursor:pointer;text-decoration:none}button:hover{background:#e1ece6}button[aria-pressed=true]{background:var(--ink);color:white}button:focus-visible,a:focus-visible{outline:3px solid #d89230;outline-offset:3px}button:disabled{opacity:.35;cursor:default}.controls{display:flex;gap:8px;flex-wrap:wrap}nav{padding:14px 3vw;display:flex;gap:8px;flex-wrap:wrap}main{max-width:1540px;margin:auto;padding:10px 3vw 25px}h1{font-size:clamp(28px,3vw,43px);letter-spacing:-.035em;line-height:1.15;margin:8px 0 12px}h2{font-size:19px;margin:0 0 13px}p{margin:9px 0}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--green);font-weight:800}.lead{font-size:20px;color:var(--muted);margin-bottom:15px}.source{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 17px;background:#e8effb;border-radius:9px;margin:15px 0 20px}.source strong{font-size:14px}.chip{display:inline-flex;gap:9px;border:1px solid #c3cfc9;border-radius:5px;padding:5px 9px;font-size:14px;background:white;font-variant-numeric:tabular-nums;align-items:center}.chip b{min-width:24px}.chip.update{border-color:#8daee0;background:#eaf1ff}.chip.insert{border-color:#74b6a0;background:#e1f4ea}.chip.keep{background:#f1f3f3;color:#435768}.chip small{font-size:11px;font-weight:750}.diagram{display:grid;grid-template-columns:1fr 42px 1.15fr 42px 1fr;align-items:start;gap:8px}.lane{min-width:0}.lane-title{font-size:12px;font-weight:800;letter-spacing:.1em;margin-bottom:12px;color:var(--muted)}.file{background:white;border:1px solid var(--line);border-left:5px solid #8da39a;border-radius:8px;margin:0 0 12px;padding:12px 14px;transition:opacity .25s}.file.active{border-left-color:var(--green)}.file.skipped{opacity:.38}.file.retained{background:#eaf3ed}.file header{padding:0;border:0;background:none;font-size:15px;margin-bottom:8px}.file header small{font-size:12px;color:var(--muted)}.rows{display:flex;gap:6px;flex-wrap:wrap}.file .chip{font-size:13px;padding:4px 6px}.file .chip b{min-width:22px}.caption{font-size:12px;color:var(--muted);margin-top:8px}.arrow{align-self:center;font-size:30px;color:var(--green);text-align:center}.panel{padding:18px;background:white;border:1px solid var(--line);border-radius:10px;min-width:0}.worker{padding:13px;margin-top:12px;border:1px solid #b7c9db;border-radius:8px;background:#f0f5fa}.worker strong{font-size:13px;display:block;margin-bottom:8px}.spill{margin-top:10px;border-top:1px dashed #9aabbb;padding-top:8px}.spill strong{color:var(--orange)}.memory-label{font-size:11px;color:var(--muted);margin-bottom:6px}.resultline{padding:10px;background:#edf6ee;border-radius:6px;margin-top:12px;font-size:15px}.fact{margin:18px 0 0;padding:16px 20px;background:#e1eee7;border-left:4px solid var(--green);font-size:20px;font-weight:600}.caution{font-size:13px;color:var(--muted);margin-top:13px}.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0;font-size:13px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:#a3b1aa}.dot.blue{background:var(--blue)}.dot.green{background:var(--green)}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 5px;text-align:left;border-bottom:1px solid var(--line)}.mini{font-size:13px;color:var(--muted)}.big{font-size:35px;font-weight:750;color:var(--green);line-height:1.1}.counts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.counts>div{border-top:2px solid var(--line);padding-top:10px}.flow-list>div{padding:12px 0;border-bottom:1px solid var(--line)}.answer{margin-top:10px;font-size:15px}.log{background:#152e43;color:#eef7f2;border-radius:7px;padding:14px;font:14px/1.8 ui-monospace,monospace;white-space:pre-wrap}.phase{border-radius:20px;background:#e0ede7;color:var(--green);padding:4px 9px;font-size:12px;display:inline-block;margin-bottom:10px}footer{max-width:1540px;margin:auto;padding:10px 3vw 25px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:850px){.diagram{grid-template-columns:1fr}.arrow{transform:rotate(90deg);height:35px}.source{gap:8px}header{align-items:flex-start}h1{font-size:29px}.brand{max-width:150px}footer{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{nav,.controls,footer{display:none}body{background:white}.diagram{grid-template-columns:1fr 30px 1fr 30px 1fr}h1{font-size:26px}.chip,.file .chip{font-size:10px}.fact{font-size:15px}}
</style></head><body>
<header><span class="brand">DELTA LAKE / THE MERGE STORY</span><div class="controls"><a class="button" href="../../Documents/Codex/2026-10-26/i-have-been-asked-to-give/outputs/delta-lake-from-files-to-tables.ipynb" download>Notebook · example 8B</a><button id="fullscreen">Full screen</button></div></header>
<nav aria-label="Walkthrough steps" id="nav"></nav>
<main><div class="eyebrow" id="phase"></div><h1 id="title"></h1><p class="lead" id="lead"></p>
<div class="source"><strong>INCOMING DELIVERY</strong><span class="chip update"><b>150</b> Fashion <small>UPDATE</small></span><span class="chip insert"><b>175</b> Social <small>INSERT</small></span><span class="mini">Full profiles supplied; other columns omitted here.</span></div>
<div class="diagram" id="diagram"></div>
<div class="legend"><span><i class="dot"></i>Preserve existing row</span><span><i class="dot blue"></i>Update existing row</span><span><i class="dot green"></i>Insert new row</span></div>
<div class="fact" id="takeaway" aria-live="polite"></div><p class="caution" id="caution"></p>
</main><footer><span id="counter"></span><span>← → navigate · F full screen · diagrams are illustrative</span><div class="controls"><button id="prev">← Previous</button><button id="next">Next →</button></div></footer>
<script>
const groups={A:[100,150,200],B:[75,125,250,300],C:[400,450,500]};
const interests={100:'Sports',150:'News',200:'Social',75:'Sports',125:'News',250:'Social',300:'Fashion',400:'Sports',450:'News',500:'Social',175:'Social'};
const allIds=Object.values(groups).flat().sort((a,b)=>a-b),resultIds=[...allIds,175].sort((a,b)=>a-b),replacement=[100,150,175,200];let step=0,memory=false;
function chip(id,after=false){let cls=after&&id===150?'update':id===175?'insert':'keep';return `<span class="chip ${cls}"><b>${id}</b> ${after&&id===150?'Fashion':interests[id]}${after&&id===150?'<small>UPDATE</small>':id===175?'<small>NEW</small>':''}</span>`}
function file(label,ids,style='',after=false,note=''){return `<div class="file ${style}"><header><b>${label}</b><small>${ids.length} rows</small></header><div class="rows">${ids.map(i=>chip(i,after)).join('')}</div>${note?`<div class="caption">${note}</div>`:''}</div>`}
function files(states={}){return Object.entries(groups).map(([k,v])=>file('File '+k,v,states[k]||'',false,`ID min ${Math.min(...v)} · max ${Math.max(...v)}`)).join('')}
function lane(title,body){return `<div class="lane"><div class="lane-title">${title}</div>${body}</div>`}
function layout(a,b,c){return a+'<div class="arrow" aria-hidden="true">→</div>'+b+'<div class="arrow" aria-hidden="true">→</div>'+c}
function worker(name,ids){const ram=memory?ids.slice(0,2):ids;const spill=memory?ids.slice(2):[];return `<div class="worker"><strong>${name} · join partition</strong><div class="memory-label">${memory?'ILLUSTRATIVE BUFFER · 2 ROW SLOTS':'Rows processed here over time; not all necessarily resident together'}</div><div class="rows">${ram.map(i=>chip(i,true)).join('')}</div>${spill.length?`<div class="spill"><strong>Illustrative spill / disk work</strong><div class="rows">${spill.map(i=>chip(i,true)).join('')}</div></div>`:''}</div>`}
const states=[
{tab:'1 · One join?',phase:'START WITH CORRECTNESS',title:'Can one outer join produce the right rows?',lead:'Yes. Match incoming profiles to existing profiles, then choose which values survive.',take:'A full outer join can express all three cases of this upsert.',caution:'This explains row semantics. A join alone does not specify which files to replace or how to commit a table update.'},
{tab:'2 · Naive overwrite',phase:'THE NAIVE BASELINE · FULL JOIN + FULL OVERWRITE',title:'Correct rows can still mean unnecessary work.',lead:'Send all target rows through the join and write the complete result—even the rows in B and C that did not change.',take:'The waste comes from rebuilding the whole table, not from a rule that outer joins must rewrite every file.',caution:'This is a conceptual distributed execution, not a measured Spark plan. Join strategy controls shuffle; existing layout may reduce it. Spark uses partitioned buffers and may spill—it does not need the entire table in one machine’s RAM.'},
{tab:'3 · Prune candidates',phase:'DISCOVERY · FIRST EXCLUDE IMPOSSIBLE FILES',title:'Statistics say “possible”, not “present”.',lead:'For this delivery, an explicit target predicate restricts IDs to 150–175. Both A and B overlap that range.',take:'A and B are candidate files. C can be excluded by its statistics before matching rows.',caution:'The predicate is valid because every source ID is in 150–175. Do not assume every runtime automatically converts arbitrary source keys into equivalent pruning. Statistics must exist for the relevant column.'},
{tab:'4 · Find touched files',phase:'PHASE 1 · INNER JOIN FOR ROW MATCHES',title:'Read candidates. Discover which files are touched.',lead:'Compare actual target IDs to source IDs 150 and 175. Only file A contains a match: ID 150.',take:'B was worth examining, but does not need reconstruction. Candidate files and touched files are different sets.',caution:'Discovery may read and shuffle data from both A and B. It is not free or necessarily lightweight. This view shows IDs and file provenance; the teaching example has unique IDs.'},
{tab:'5 · Reconstruct',phase:'PHASE 2 · FULL OUTER JOIN ON TOUCHED FILES',title:'Why can’t we write just the matching row?',lead:'If we remove A, its unchanged rows 100 and 200 disappear too. Read all of A and combine it with the incoming delivery.',take:'Preserve 100 and 200. Update 150. Insert 175. Keep B and C’s existing files.',caution:'Classic copy-on-write update-plus-insert example, with deletion vectors disabled. Other MERGE clauses and execution paths can use different join types. The source must still include new IDs such as 175.'},
{tab:'6 · Commit & compare',phase:'PUBLISH THE NEW SNAPSHOT',title:'Rewrite four rows. Retain seven in place.',lead:'The transaction replaces A’s contribution with newly written data and leaves B and C in the active snapshot.',take:'One join can calculate the table. Discovering touched files first avoids rebuilding parts that can stay as they are.',caution:'New rows may span several output files. A logical remove is not immediate physical deletion. Discovery adds work; when most files are touched, the rewrite savings shrink. Counts here describe this toy example, not throughput or memory measurements.'}
];
function render(){const s=states[step];document.getElementById('phase').textContent=s.phase;document.getElementById('title').textContent=s.title;document.getElementById('lead').textContent=s.lead;document.getElementById('takeaway').textContent=s.take;document.getElementById('caution').textContent=s.caution;let html='';
if(step===0)html=layout(lane('TARGET · 10 ROWS IN 3 FILES',files()),lane('ONE FULL OUTER JOIN',`<div class="panel"><table><tr><th>Target</th><th>Source</th><th>Action</th></tr><tr><td>Present</td><td>Present</td><td>Update</td></tr><tr><td>Absent</td><td>Present</td><td>Insert</td></tr><tr><td>Present</td><td>Absent</td><td>Preserve</td></tr></table><p class="answer">The join must retain target-only rows and source-only rows.</p></div>`),lane('CORRECT LOGICAL RESULT',`<div class="panel"><div class="rows">${resultIds.map(i=>chip(i,true)).join('')}</div><div class="resultline">11 rows · one update · one insert</div></div>`));
if(step===1)html=layout(lane('READ ALL TARGET FILES',files({A:'active',B:'active',C:'active'})),lane('EXECUTOR WORK · SCAN / JOIN',`<div class="panel"><p class="mini">Source and target rows meet by ID. Network redistribution may be required.</p>${worker('Worker 1',resultIds.filter(i=>Math.floor(i/25)%2===0))}${worker('Worker 2',resultIds.filter(i=>Math.floor(i/25)%2!==0))}<button id="memory" style="margin-top:12px" aria-pressed="${memory}">${memory?'Hide':'Show'} illustrative memory / spill</button><p class="mini">2-row buffer is invented for the picture, not a Spark setting or measured capacity.</p></div>`),lane('FULL OVERWRITE · NEW FILES',`<div class="panel"><div class="rows">${resultIds.map(i=>chip(i,true)).join('')}</div><div class="counts"><div><div class="big">11</div><span class="mini">rows written</span></div><div><div class="big">9</div><span class="mini">unchanged rows written again</span></div></div></div>`));
if(step===2)html=layout(lane('EXISTING FILES',files({C:'skipped'})),lane('LOG STATISTICS · NO ROW MATCHING YET',`<div class="panel"><table><tr><th>File</th><th>Min–max</th><th>Overlap?</th></tr><tr><td>A</td><td>100–200</td><td>Yes</td></tr><tr><td>B</td><td>75–300</td><td>Yes</td></tr><tr><td>C</td><td>400–500</td><td>No</td></tr></table><p class="answer">Filter: target ID between 150 and 175.</p></div>`),lane('CANDIDATES FOR DISCOVERY',file('Candidate A',groups.A,'active')+file('Candidate B',groups.B,'active')+'<div class="resultline">C: excluded by metadata</div>'));
if(step===3)html=layout(lane('SCAN CANDIDATES · IDs + FILE NAMES',file('A · candidate',[100,150,200],'active')+file('B · candidate',[75,125,250,300],'active')+'<div class="resultline">C: not part of matching scan</div>'),lane('INNER JOIN · SOURCE IDs 150, 175',`<div class="panel"><div class="worker"><strong>Read A’s IDs</strong><div class="rows">${[100,150,200].map(i=>`<span class="chip ${i===150?'update':'keep'}"><b>${i}</b>${i===150?'MATCH':'no match'}</span>`).join('')}</div></div><div class="worker"><strong>Read B’s IDs</strong><div class="rows">${[75,125,250,300].map(i=>`<span class="chip keep"><b>${i}</b>no match</span>`).join('')}</div></div><p class="answer">175 has no target match; retain it in the source for the insert phase.</p></div>`),lane('TOUCHED FILE LIST',file('Touched: A',groups.A,'active',false,'ID 150 matched')+'<div class="panel"><b>B is excluded from reconstruction.</b><p class="mini">It may already have incurred discovery read/shuffle work.</p></div>'));
if(step===4)html=layout(lane('RE-READ ALL ROWS FROM A',file('Touched file A',groups.A,'active')+'<div class="panel"><p>Removing A also removes:</p><div class="rows">'+chip(100)+chip(200)+'</div><p class="mini">These unmatched target rows must survive.</p></div>'),lane('FULL OUTER JOIN · A + SOURCE',`<div class="panel"><table><tr><th>ID</th><th>Old → new interest</th><th>Action</th></tr><tr><td>100</td><td>Sports → Sports</td><td>Preserve</td></tr><tr><td>150</td><td>News → Fashion</td><td>Update</td></tr><tr><td>175</td><td>— → Social</td><td>Insert</td></tr><tr><td>200</td><td>Social → Social</td><td>Preserve</td></tr></table><div class="resultline">Matching rows alone would lose 100 and 200.</div></div>`),lane('NEW DATA + RETAINED FILES',file('Rows for new file(s)',replacement,'active',true)+file('B · retain existing file',groups.B,'retained')+file('C · retain existing file',groups.C,'retained')));
if(step===5)html=layout(lane('OLD SNAPSHOT',files({A:'skipped',B:'retained',C:'retained'})),lane('ATOMIC COMMIT',`<div class="panel"><div class="log">remove: A.parquet<br>add: new data file(s)<br><br>B and C stay active.</div><div class="counts"><div><div class="big">11 → 4</div><span class="mini">rows written: naive → selective</span></div><div><div class="big">7</div><span class="mini">rows retained in existing files</span></div></div><p class="answer">A’s unchanged rows are still copied. B’s and C’s are not.</p><a class="button" href="delta-lake-from-files-to-tables.ipynb" download>Show the evidence · notebook 8B</a></div>`),lane('NEW SNAPSHOT · 11 ROWS',file('New data file(s)',replacement,'active',true)+file('B · same file',groups.B,'retained')+file('C · same file',groups.C,'retained')));
document.getElementById('diagram').innerHTML=html;document.querySelectorAll('#nav button').forEach((b,i)=>b.setAttribute('aria-pressed',i===step));document.getElementById('counter').textContent=`${step+1} / ${states.length}`;document.getElementById('prev').disabled=step===0;document.getElementById('next').disabled=step===states.length-1;if(document.getElementById('memory'))document.getElementById('memory').onclick=()=>{memory=!memory;render()};history.replaceState(null,'','#'+(step+1));}
states.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s.tab;b.onclick=()=>go(i);document.getElementById('nav').append(b)});
function go(i){step=Math.max(0,Math.min(states.length-1,i));render();window.scrollTo(0,0)}
document.getElementById('prev').onclick=()=>go(step-1);document.getElementById('next').onclick=()=>go(step+1);document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){document.getElementById('fullscreen').textContent='Use browser full screen'}};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;if(e.key==='ArrowRight'){e.preventDefault();go(step+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(step-1)}if(e.key.toLowerCase()==='f')document.getElementById('fullscreen').click()});go(Number(location.hash.slice(1)||1)-1||0);
</script></body></html>
